<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Community Hall System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0a0f1e; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: rgba(30,41,59,0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 32px; width: 100%; max-width: 440px; }
        .form-input { width: 100%; padding: 12px 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #e2e8f0; margin-bottom: 16px; outline: none; }
        .btn-auth { width: 100%; padding: 12px; background: linear-gradient(135deg, #10b981, #059669); border: none; border-radius: 12px; color: white; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
<div class="auth-card">
    <div class="text-center mb-4">
        <div style="font-size:2.8rem;">🔒</div>
        <h2 class="text-white fw-bold mt-2" style="font-size:1.3rem;">Set New Password</h2>
        <p style="color:#94a3b8;font-size:0.85rem;">Enter your new secret password</p>
    </div>
    {% if msg %}<div class="alert alert-danger" style="font-size:0.85rem;">{{ msg }}</div>{% endif %}
    <form method="POST">
        <label style="color:#94a3b8;font-size:0.75rem;font-weight:600;text-transform:uppercase;margin-bottom:6px;display:block;">New Password</label>
        <input type="password" name="password" class="form-input" placeholder="Enter at least 4 characters" required>
        <button type="submit" class="btn-auth">Update Password</button>
    </form>
</div>
</body>
</html>
