<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Community Hall System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a0f1e; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: rgba(30,41,59,0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 32px; width: 100%; max-width: 440px; }
        .form-label { display: block; color: #94a3b8; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; margin-bottom: 6px; }
        .form-input { width: 100%; padding: 12px 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #e2e8f0; font-size: 0.9rem; outline: none; margin-bottom: 16px; }
        .form-input:focus { border-color: #6366f1; background: rgba(99,102,241,0.1); }
        .btn-auth { width: 100%; padding: 12px; background: linear-gradient(135deg, #6366f1, #8b5cf6); border: none; border-radius: 12px; color: white; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
<div class="auth-card">
    <div class="text-center mb-4">
        <div style="font-size:2.8rem;">🔑</div>
        <h2 class="text-white fw-bold mt-2" style="font-size:1.3rem;">Forgot Password</h2>
        <p style="color:#94a3b8;font-size:0.85rem;">Enter your email to receive a password reset link</p>
    </div>
    
    {% if msg %}
        {% if success %}
        <div class="alert alert-success" style="font-size:0.85rem;">
            {{ msg }}
            {% if token %}
            <div class="mt-2"><a href="/reset_password/{{ token }}" class="btn btn-sm btn-outline-success">Click to Reset Now (Dev Mode)</a></div>
            {% endif %}
        </div>
        {% else %}
        <div class="alert alert-danger" style="font-size:0.85rem;">{{ msg }}</div>
        {% endif %}
    {% endif %}

    <form method="POST">
        <label class="form-label">Registered Email</label>
        <input type="email" name="email" class="form-input" placeholder="e.g. user@gmail.com" required>
        <button type="submit" class="btn-auth"><i class="fas fa-paper-plane me-1"></i> Send Reset Link</button>
    </form>
    
    <div class="text-center mt-3">
        <a href="/login" style="color:#818cf8;text-decoration:none;font-size:0.85rem;">← Back to Sign In</a>
    </div>
</div>
</body>
</html>
